spring.application.name=order-service
server.port=8084

spring.config.import=optional:configserver:http://localhost:8888

user.service.url=http://localhost:8083
payment.service.url=http://localhost:8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# =========================================================
# RESILIENCE4J RETRY
# =========================================================

resilience4j.retry.instances.paymentRetry.max-attempts=2
resilience4j.retry.instances.paymentRetry.wait-duration=1s

resilience4j.retry.instances.paymentRetry.retry-exceptions=org.springframework.web.client.HttpServerErrorException